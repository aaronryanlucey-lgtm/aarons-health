<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aaron's Health">
<meta name="theme-color" content="#0d0d0f">
<title>Aaron's Health</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d0d0f'/%3E%3Cpath d='M90 138c-3-2-42-27-42-58a26 26 0 0 1 42-20 26 26 0 0 1 42 20c0 31-39 56-42 58z' fill='none' stroke='%234ade80' stroke-width='9' stroke-linejoin='round'/%3E%3Cpath d='M56 92h16l7-16 10 30 8-20 5 6h18' fill='none' stroke='%234ade80' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --bg:#0d0d0f; --card:#17171a; --line:#232327; --line2:#2c2c31;
    --green:#4ade80; --green-dim:rgba(74,222,128,0.14); --green-bd:rgba(74,222,128,0.32);
    --red:#f87171; --red-dim:rgba(248,113,113,0.12);
    --blue:#3d8add; --blue-dim:rgba(61,138,221,0.12); --blue-bd:rgba(61,138,221,0.45);
    --txt:#ededf0; --muted:#8a8a92; --white:#ffffff;
  }
  html,body{ background:var(--bg); color:var(--txt); font-family:'Inter',-apple-system,system-ui,sans-serif; overscroll-behavior-y:none; }
  body{ min-height:100vh; min-height:100dvh; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  .brand{ display:flex; align-items:center; gap:10px; padding:14px 20px 6px; }
  .logo{ width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#4ade80,#22c55e); display:flex; align-items:center; justify-content:center; }
  .logo svg{ width:20px; height:20px; }
  .brand h1{ font-size:17px; font-weight:600; color:var(--white); letter-spacing:0.01em; }
  .screen{ flex:1; padding:6px 20px 120px; }
  .phead{ display:flex; align-items:center; justify-content:space-between; margin:8px 0 2px; }
  .phead .t{ font-size:22px; font-weight:600; color:var(--white); }
  .phead .s{ font-size:13px; color:var(--muted); margin-top:1px; }
  .ring{ width:62px; height:62px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .ring > div{ width:50px; height:50px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--white); }
  .sect{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; margin:20px 0 9px; font-weight:500; }
  .stack{ display:flex; flex-direction:column; gap:9px; }
  .row{ width:100%; display:flex; align-items:center; gap:14px; background:var(--card); border:0.5px solid var(--line); border-radius:15px; padding:15px 16px; cursor:pointer; text-align:left; font-family:inherit; transition:border-color .15s, transform .05s; }
  .row:active{ transform:scale(0.99); }
  .row.on{ border-color:var(--green-bd); }
  .row .ic{ font-size:21px; color:var(--muted); width:24px; text-align:center; }
  .row .lb{ flex:1; font-size:15px; color:var(--txt); }
  .row .sub{ display:block; font-size:11px; color:var(--muted); margin-top:2px; }
  .badge{ width:31px; height:31px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .badge.yes{ background:var(--green-dim); }
  .badge.no{ background:var(--red-dim); }
  .badge.just{ animation:pop .24s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pop{ 0%{ transform:scale(.4); opacity:.4; } 60%{ transform:scale(1.18); } 100%{ transform:scale(1); opacity:1; } }
  .badge svg{ width:17px; height:17px; }
  .bottles{ display:flex; gap:9px; }
  .bottle{ flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; background:var(--card); border:0.5px solid var(--line); border-radius:15px; padding:15px 0; cursor:pointer; font-family:inherit; transition:.15s; }
  .bottle:active{ transform:scale(0.98); }
  .bottle.full{ background:var(--blue-dim); border-color:var(--blue-bd); }
  .bottle svg{ width:27px; height:27px; }
  .bottle span{ font-size:12px; color:var(--muted); }
  .bottle.full span{ color:var(--blue); }
  .stats{ display:flex; gap:9px; margin:14px 0; }
  .stat{ flex:1; background:var(--card); border:0.5px solid var(--line); border-radius:15px; padding:15px; }
  .stat .k{ font-size:12px; color:var(--muted); }
  .stat .v{ font-size:23px; font-weight:600; color:var(--white); margin-top:3px; }
  .stat .v small{ font-size:13px; color:var(--muted); font-weight:400; }
  .card{ background:var(--card); border:0.5px solid var(--line); border-radius:15px; }
  .logrow{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-radius:15px; margin-bottom:9px; background:var(--card); border:0.5px solid var(--line); }
  .logrow .d{ font-size:14px; color:var(--muted); }
  .logrow .w{ font-size:15px; color:var(--txt); font-weight:500; }
  .logrow .ch{ font-size:13px; min-width:56px; text-align:right; }
  .empty{ text-align:center; color:var(--muted); font-size:14px; padding:36px 20px; line-height:1.6; }
  .weighbtn{ width:100%; }
  .daynav{ width:34px; height:34px; border-radius:10px; background:var(--card); border:0.5px solid var(--line); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .daynav svg{ width:18px; height:18px; }
  .daynav:disabled{ cursor:default; }
  .mealrow{ display:flex; align-items:stretch; gap:8px; background:var(--card); border:0.5px solid var(--line); border-radius:15px; padding:6px 8px 6px 8px; transition:border-color .15s; }
  .mealtick:active{ transform:scale(0.99); }
  .mealrow.on{ border-color:var(--green-bd); }
  .mealrow.need{ border-color:rgba(250,204,21,0.5); }
  .mealtick{ flex:1; display:flex; align-items:center; gap:14px; background:none; border:none; padding:9px 8px; cursor:pointer; text-align:left; font-family:inherit; }
  .mealtick .ic{ font-size:21px; color:var(--muted); width:24px; text-align:center; }
  .mealtick .lb{ flex:1; font-size:15px; color:var(--txt); }
  .calbtn{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; border:none; border-left:0.5px solid var(--line); background:transparent; padding:8px 6px; min-width:72px; cursor:pointer; font-family:inherit; }
  .calbtn:active{ transform:scale(0.96); }
  .calnum{ font-size:16px; font-weight:600; color:var(--white); line-height:1.1; }
  .calk{ font-size:10px; color:var(--muted); }
  .caladd{ font-size:13px; color:var(--muted); font-weight:500; }
  .mealrow.need .caladd{ color:#facc15; }
  .caltot{ display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding:12px 16px; background:var(--card); border:0.5px solid var(--line); border-radius:13px; font-size:13px; color:var(--muted); }
  .caltot.over{ border-color:var(--red); background:rgba(248,113,113,0.08); color:var(--red); }
  .note{ width:100%; background:var(--card); border:0.5px solid var(--line); border-radius:14px; padding:13px 15px; font-family:inherit; font-size:14px; color:var(--txt); resize:none; line-height:1.5; }
  .note:focus{ outline:none; border-color:var(--green-bd); }
  .note::placeholder{ color:var(--muted); }
  .statusbar{ display:flex; align-items:center; gap:9px; padding:12px 15px; border-radius:13px; font-size:14px; font-weight:500; margin-bottom:4px; }
  .statusbar svg{ width:18px; height:18px; flex-shrink:0; }
  .statusbar.pass{ background:var(--green-dim); color:var(--green); border:0.5px solid var(--green-bd); }
  .statusbar.fail{ background:rgba(248,113,113,0.10); color:var(--red); border:0.5px solid var(--red); }
  .statusbar.neutral{ background:var(--card); color:var(--muted); border:0.5px solid var(--line); }
  .seg{ display:flex; gap:4px; background:var(--card); border:0.5px solid var(--line); border-radius:12px; padding:4px; margin:14px 0 12px; }
  .segbtn{ flex:1; padding:9px 0; border-radius:9px; background:none; border:none; color:var(--muted); font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; }
  .segbtn.on{ background:#2a2a30; color:var(--white); }
  .nav{ position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; display:flex; background:rgba(13,13,15,0.92); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:0.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -8px 24px rgba(0,0,0,0.35); }
  .navbtn{ flex:1; background:none; border:none; padding:11px 0 12px; display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; color:var(--muted); font-family:inherit; }
  .navbtn svg{ width:23px; height:23px; }
  .navbtn span{ font-size:11px; }
  .navbtn.active{ color:var(--white); }
  /* modal */
  .modal-bg{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .modal-bg.show{ display:flex; }
  .modal{ background:#1b1b1f; width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:22px 22px calc(22px + env(safe-area-inset-bottom)); }
  .modal h3{ font-size:18px; font-weight:600; color:var(--white); margin-bottom:4px; }
  .modal p{ font-size:13px; color:var(--muted); margin-bottom:18px; }
  .winput{ width:100%; background:var(--card); border:0.5px solid var(--line2); border-radius:14px; padding:16px; font-size:22px; font-weight:600; color:var(--white); font-family:inherit; text-align:center; margin-bottom:16px; }
  .winput:focus{ outline:none; border-color:var(--green-bd); }
  .mbtns{ display:flex; gap:10px; }
  .mbtn{ flex:1; padding:15px 0; border-radius:14px; font-size:15px; font-weight:500; font-family:inherit; cursor:pointer; border:0.5px solid var(--line2); background:transparent; color:var(--txt); }
  .mbtn.primary{ background:var(--green); border-color:var(--green); color:#0d0d0f; }
  .install{ margin:16px 0 4px; background:var(--card); border:0.5px solid var(--line); border-radius:15px; padding:15px 16px; font-size:13px; color:var(--muted); line-height:1.6; display:flex; gap:12px; align-items:flex-start; }
  .install svg{ width:20px; height:20px; flex-shrink:0; color:var(--green); margin-top:1px; }
  .install b{ color:var(--txt); font-weight:500; }
  .install .close{ margin-left:auto; color:var(--muted); cursor:pointer; font-size:20px; line-height:1; }
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 20c-1-.7-11-7-11-13a6.5 6.5 0 0 1 11-4 6.5 6.5 0 0 1 11 4c0 6-10 12.3-11 13z" stroke="#0d0d0f" stroke-width="2" stroke-linejoin="round"/><path d="M4 12h3.5l1.5-3.5L11.5 16 13 11l1 1.5h6" stroke="#0d0d0f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h1>Aaron's Health</h1>
  </div>
  <div class="screen" id="screen"></div>
  <div class="nav" id="nav">
    <button class="navbtn" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12l2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Today</span></button>
    <button class="navbtn" data-tab="weight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5a7 7 0 0 1 7 7H5a7 7 0 0 1 7-7z"/><path d="M12 5v0M4 12v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6" stroke-linecap="round"/><path d="M12 9l2-2" stroke-linecap="round"/></svg><span>Weight</span></button>
    <button class="navbtn" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 4-6"/></svg><span>Progress</span></button>
  </div>
</div>

<div class="modal-bg" id="modalbg">
  <div class="modal">
    <h3>Log today's weight</h3>
    <p>Enter your weight in kilograms.</p>
    <input class="winput" id="winput" type="number" inputmode="decimal" step="0.1" placeholder="82.4">
    <div class="mbtns">
      <button class="mbtn" id="mcancel">Cancel</button>
      <button class="mbtn primary" id="msave">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="goalbg">
  <div class="modal">
    <h3>Goal weight</h3>
    <p>Your target in kilograms. The bar tracks from your first weigh-in to here.</p>
    <input class="winput" id="ginput" type="number" inputmode="decimal" step="0.1" placeholder="75.0">
    <div class="mbtns">
      <button class="mbtn" id="gcancel">Cancel</button>
      <button class="mbtn primary" id="gsave">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="calbg">
  <div class="modal">
    <h3 id="caltitle">Calories</h3>
    <p>Enter the calories for this meal.</p>
    <input class="winput" id="calinput" type="number" inputmode="numeric" placeholder="kcal">
    <div class="mbtns">
      <button class="mbtn" id="calclear">Clear</button>
      <button class="mbtn primary" id="calsave">Save</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var SVG = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
    bottle:function(c){return '<svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.7" stroke-linejoin="round"><path d="M10 2h4M10 2v2.5L8.5 7A3 3 0 0 0 8 8.7V20a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8.7A3 3 0 0 0 15.5 7L14 4.5V2"/><path d="M8 13h8" stroke-linecap="round"/></svg>';},
    ico:function(k,c){var p={
      breakfast:'<circle cx="12" cy="13" r="7"/><path d="M12 6V3M9 4l-1-1M15 4l1-1" stroke-linecap="round"/>',
      lunch:'<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M4 15h16" stroke-linecap="round"/><path d="M12 11V7M12 7a2 2 0 1 0 0-4" stroke-linecap="round"/>',
      dinner:'<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10" stroke-linecap="round"/><path d="M16 3c-1.5 0-2.5 2-2.5 5s1 4 2.5 4 2.5-1 2.5-4-1-5-2.5-5zM16 12v9" stroke-linecap="round"/>',
      snacks:'<circle cx="12" cy="12" r="8"/><circle cx="9.5" cy="10" r="1" fill="'+c+'"/><circle cx="14" cy="9.5" r="1" fill="'+c+'"/><circle cx="13" cy="14" r="1" fill="'+c+'"/><circle cx="9" cy="14" r="1" fill="'+c+'"/>',
      cardio:'<circle cx="14" cy="5" r="2"/><path d="M6 21l3-6 3 1 1 5M9 15l-2-4 5-2 3 3 3 0" stroke-linecap="round" stroke-linejoin="round"/>',
      weights:'<path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" stroke-linecap="round"/>',
      steps:'<path d="M8 4c1.5 0 2.5 2 2.5 5s-.5 6-2.5 6-2.5-2-2.5-5S6.5 4 8 4zM8 15v3a2 2 0 0 0 4 0M16 8c1.2 0 2 1.6 2 4s-.4 5-2 5-2-1.6-2-4 .8-5 2-5zM16 17v2a1.6 1.6 0 0 0 3.2 0" stroke-linecap="round" stroke-linejoin="round"/>',
      scale:'<path d="M12 5a7 7 0 0 1 7 7H5a7 7 0 0 1 7-7z"/><path d="M12 9l2-2" stroke-linecap="round"/>'
    };return '<svg viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.8">'+(p[k]||'')+'</svg>';},
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="#ededf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
    chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="#ededf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8h.01M11 12h1v4h1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9"/></svg>'
  };

  var GREEN='#4ade80', RED='#f87171', MUTED='#8a8a92', LINE='#232327';
  var MEALS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snacks','Snacks']];
  var ACTS=[['cardio','Cardio'],['weights','Weight training']];
  var WATER_TOTAL=3;
  var CAL_LIMIT=2000;

  // ---------- storage ----------
  function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function load(){ try{ return JSON.parse(localStorage.getItem('aaronsHealth')||'{}'); }catch(e){ return {}; } }
  function save(db){ localStorage.setItem('aaronsHealth', JSON.stringify(db)); }
  function blankDay(){ return { breakfast:null, lunch:null, dinner:null, snacks:null, cardio:null, weights:null, steps:false, water:0, weight:null, failed:false, cals:{breakfast:null,lunch:null,dinner:null,snacks:null}, note:'' }; }

  // One-time fresh start: wipe any old test data once, when this build first runs.
  // Bump FRESH_START to a new value any time you want a clean slate again.
  var FRESH_START='2026-fresh-1';
  var db = load();
  if(db.freshStart !== FRESH_START){
    db = { days:{}, freshStart:FRESH_START, goal:(db.goal!=null?db.goal:null) };
    save(db);
  }
  if(!db.days) db.days = {};
  function getDay(k){ k=k||viewKey; if(!db.days[k]) db.days[k]=blankDay(); var d=db.days[k]; if(!d.cals) d.cals={breakfast:null,lunch:null,dinner:null,snacks:null}; if(d.note==null) d.note=''; return d; }

  function totalCals(day){ var t=0,any=false; MEALS.forEach(function(m){ var c=day.cals&&day.cals[m[0]]; if(c!=null){ t+=c; any=true; } }); return any?t:null; }
  function overLimit(day){ var t=totalCals(day); return t!=null && t>CAL_LIMIT; }

  var TICK_FIELDS=['breakfast','lunch','dinner','snacks','cardio','weights'];
  function completion(day){
    if(day.failed) return 0;
    if(overLimit(day)) return 0;
    var n=0, total=8;
    TICK_FIELDS.forEach(function(f){ if(day[f]===true) n++; });
    if(day.steps===true) n++;
    if(day.water>=WATER_TOTAL) n++;
    return Math.round(n/total*100);
  }
  // a day counts as a failure if calories blew the limit, or completion is under 70%
  // BUT a completely untouched day (nothing logged at all) is neither pass nor fail — it's just empty.
  function isEmpty(day){
    if(day.water>0 || day.weight!=null || day.steps===true || day.failed) return false;
    if(day.note && day.note.length) return false;
    if(totalCals(day)!=null) return false;
    for(var i=0;i<TICK_FIELDS.length;i++){ if(day[TICK_FIELDS[i]]!==null) return false; }
    return true;
  }
  function isFailure(day){ if(isEmpty(day)) return false; return overLimit(day) || day.failed || completion(day)<70; }
  var PASS_THRESHOLD=70;
  function fmtDate(d){ return d.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'}); }
  function keyToDate(k){ return new Date(k+'T00:00:00'); }

  var screen=document.getElementById('screen');
  var currentTab='today';
  var viewKey=todayKey();
  var justChanged=null;
  function isToday(){ return viewKey===todayKey(); }
  function shiftDay(delta){ var d=keyToDate(viewKey); d.setDate(d.getDate()+delta); var nk=todayKey(d); if(nk<=todayKey()) viewKey=nk; }

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // ---------- TODAY ----------
  function renderToday(){
    var day=getDay();
    var pct=completion(day);
    var fail = isFailure(day);
    var zeroCal = overLimit(day);
    var ringStyle = fail
      ? 'background:conic-gradient(#f87171 '+(zeroCal?100:Math.max(pct,4))+'%, #232327 0);'
      : 'background:conic-gradient(#4ade80 '+pct+'%, #232327 0);';
    var ringInner = fail
      ? '<div style="color:#f87171;">'+(zeroCal?0:pct)+'%</div>'
      : '<div>'+pct+'%</div>';

    var titleTxt = isToday() ? 'Today' : fmtDate(keyToDate(viewKey));
    var subTxt = isToday() ? fmtDate(new Date()) : 'Editing past day';
    var canForward = !isToday();
    var h='<div class="phead"><div style="display:flex;align-items:center;gap:6px;">'
      + '<button class="daynav" data-act="prevday" aria-label="Previous day">'+SVG.chevL+'</button>'
      + '<div><div class="t">'+titleTxt+'</div><div class="s">'+subTxt+'</div></div>'
      + '<button class="daynav" data-act="nextday" '+(canForward?'':'disabled style="opacity:.25;"')+' aria-label="Next day">'+SVG.chevR+'</button>'
      + '</div>'
      + '<div class="ring" style="'+ringStyle+'">'+ringInner+'</div></div>';

    if(!isToday()){
      h+='<button class="row" data-act="backtoday" style="justify-content:center;margin-bottom:4px;padding:11px;"><span class="lb" style="flex:0;color:'+GREEN+';font-size:13px;">← Back to today</span></button>';
    }

    // pass/fail status banner
    if(fail){
      var why = zeroCal ? 'Over '+CAL_LIMIT+' kcal' : 'Under '+PASS_THRESHOLD+'%';
      h+='<div class="statusbar fail">'+SVG.x+'<span>Failed day · '+why+'</span></div>';
    } else if(pct>=PASS_THRESHOLD){
      h+='<div class="statusbar pass">'+SVG.check+'<span>'+(pct===100?'Perfect day':'Passing day')+' · '+pct+'%</span></div>';
    } else {
      h+='<div class="statusbar neutral"><span>Reach '+PASS_THRESHOLD+'% to pass the day</span></div>';
    }

    var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if(isToday() && !standalone && !db.installDismissed){
      h+='<div class="install">'+SVG.info+'<div><b>Add to your home screen.</b> Tap the Share button in Safari, then “Add to Home Screen” — it opens fullscreen like a real app and keeps your data.</div><span class="close" data-act="dismiss-install">×</span></div>';
    }

    // meals with calories
    var tc=totalCals(day), over=overLimit(day);
    h+='<div class="sect">Meals · tap ✓ good / ✗ bad, add calories</div><div class="stack">';
    MEALS.forEach(function(m){ h+=mealRow(m[0], m[1], day); });
    h+='</div>';
    // calorie total bar
    h+='<div class="caltot'+(over?' over':'')+'">'
      + '<span>'+(tc==null?'No calories logged':'Total '+tc+' / '+CAL_LIMIT+' kcal')+'</span>'
      + '<span style="font-weight:600;">'+(tc==null?'':(over?'Over — day fails':(CAL_LIMIT-tc)+' left'))+'</span></div>';

    h+='<div class="sect">Water · '+day.water+' of '+WATER_TOTAL+' bottles</div><div class="bottles">';
    for(var i=0;i<WATER_TOTAL;i++){ var f=i<day.water;
      h+='<button class="bottle'+(f?' full':'')+'" data-act="water" data-i="'+i+'">'+SVG.bottle(f?'#3d8add':MUTED)+'<span>'+(f?'Done':'Bottle '+(i+1))+'</span></button>';
    }
    h+='</div>';

    h+='<div class="sect">Activity</div><div class="stack">';
    ACTS.forEach(function(a){ h+=tickRow(a[0], a[1], day[a[0]]); });
    // steps — manual tick
    var son=day.steps===true;
    var stepsJust=(justChanged==='steps')?' just':'';
    h+='<button class="row'+(son?' on':'')+'" data-act="steps"><span class="ic">'+SVG.ico('steps',MUTED)+'</span>'
      + '<span class="lb">12k steps<span class="sub">Tap ✓ when your watch hits 12,000</span></span>'
      + '<span class="badge '+(son?'yes':'no')+stepsJust+'">'+(son?SVG.check:SVG.x)+'</span></button>';
    h+='</div>';

    h+='<div class="sect">Weigh-in</div>';
    h+='<button class="row weighbtn" data-act="weigh"><span class="ic">'+SVG.ico('scale',MUTED)+'</span>'
      + '<span class="lb">Weight</span>'
      + '<span class="w" style="font-size:15px;color:'+(day.weight?'#fff':MUTED)+';font-weight:'+(day.weight?'600':'400')+';margin-right:8px;">'+(day.weight?day.weight.toFixed(1)+' kg':'Add')+'</span>'
      + SVG.chev+'</button>';

    // note
    h+='<div class="sect">Note</div>';
    h+='<textarea class="note" data-act="note" rows="2" placeholder="Anything about this day — how you felt, why it went well or not…">'+esc(day.note)+'</textarea>';

    screen.innerHTML=h;
    var ta=screen.querySelector('.note');
    if(ta){ ta.addEventListener('input', function(){ getDay().note=ta.value; save(db); }); }
  }

  function mealRow(id,lbl,day){
    var val=day[id]; var on=val===true, unset=val===null;
    var cal=day.cals&&day.cals[id]!=null?day.cals[id]:null;
    var justc=(justChanged===id)?' just':'';
    var badge = unset ? '<span class="badge no'+justc+'" style="background:#232327;opacity:.5;"><svg viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></span>'
      : '<span class="badge '+(on?'yes':'no')+justc+'">'+(on?SVG.check:SVG.x)+'</span>';
    var needCal = (val!==null) && (cal==null);
    var calDisplay = cal!=null
      ? '<span class="calnum">'+cal+'</span><span class="calk">kcal</span>'
      : '<span class="caladd">'+(needCal?'+ kcal':'kcal')+'</span>';
    return '<div class="mealrow'+(on?' on':'')+(needCal?' need':'')+'">'
      + '<button class="mealtick" data-act="tick" data-id="'+id+'"><span class="ic">'+SVG.ico(id,MUTED)+'</span><span class="lb">'+lbl+'</span>'+badge+'</button>'
      + '<button class="calbtn" data-act="calopen" data-id="'+id+'">'+calDisplay+'</button>'
      + '</div>';
  }
  function tickRow(id,lbl,val){
    var on=val===true, off=val===false, unset=val===null;
    var cls = on?' on':'';
    var justc=(justChanged===id)?' just':'';
    var badge = unset ? '<span class="badge no'+justc+'" style="background:#232327;opacity:.5;"><svg viewBox="0 0 24 24" fill="none" stroke="#8a8a92" stroke-width="2" stroke-linecap="round"><path d="M6 12h12"/></svg></span>'
      : '<span class="badge '+(on?'yes':'no')+justc+'">'+(on?SVG.check:SVG.x)+'</span>';
    return '<button class="row'+cls+'" data-act="tick" data-id="'+id+'"><span class="ic">'+SVG.ico(id,MUTED)+'</span>'
      + '<span class="lb">'+lbl+'</span>'+badge+'</button>';
  }

  // ---------- WEIGHT ----------
  function renderWeight(){
    var entries=[];
    Object.keys(db.days).sort().forEach(function(k){ var d=db.days[k]; if(d.weight!=null) entries.push([k,d.weight]); });
    var h='<div class="phead"><div><div class="t">Weight</div><div class="s">Day by day</div></div></div>';
    if(entries.length===0){
      h+='<div class="empty">No weigh-ins yet.<br>Add today\'s weight from the Today tab and it\'ll show up here.</div>';
      screen.innerHTML=h; return;
    }
    var vals=entries.map(function(e){return e[1];});
    var current=vals[vals.length-1];
    var lost=(vals[0]-current);
    h+='<div class="stats"><div class="stat"><div class="k">Current</div><div class="v">'+current.toFixed(1)+'<small> kg</small></div></div>'
      + '<div class="stat"><div class="k">'+(lost>=0?'Lost':'Gained')+'</div><div class="v" style="color:'+(lost>=0?GREEN:RED)+'">'+Math.abs(lost).toFixed(1)+'<small> kg</small></div></div></div>';

    // ---- goal bar ----
    var start=vals[0];
    if(db.goal!=null){
      var goal=db.goal;
      var totalToLose=start-goal;
      var doneSoFar=start-current;
      var frac = totalToLose>0 ? Math.max(0, Math.min(1, doneSoFar/totalToLose)) : (current<=goal?1:0);
      var pctDone=Math.round(frac*100);
      var toGo=(current-goal);
      h+='<div class="card" style="padding:16px;margin-bottom:16px;">'
        + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">'
        + '<span style="font-size:14px;color:#ededf0;">Goal '+goal.toFixed(1)+' kg</span>'
        + '<span style="font-size:13px;color:'+(toGo<=0?GREEN:MUTED)+';">'+(toGo<=0?'Reached! 🎉':toGo.toFixed(1)+' kg to go')+'</span></div>'
        + '<div style="position:relative;height:8px;background:#232327;border-radius:5px;overflow:hidden;margin-bottom:8px;">'
        + '<div style="position:absolute;left:0;top:0;bottom:0;width:'+pctDone+'%;background:linear-gradient(90deg,#4ade80,#22c55e);border-radius:5px;"></div></div>'
        + '<div style="display:flex;justify-content:space-between;font-size:11px;color:'+MUTED+';">'
        + '<span>Start '+start.toFixed(1)+'</span><span style="color:#ededf0;">Now '+current.toFixed(1)+'</span><span>Goal '+goal.toFixed(1)+'</span></div>'
        + '<button class="row" data-act="goal" style="margin-top:14px;padding:11px;justify-content:center;"><span class="lb" style="flex:0;font-size:13px;color:'+MUTED+';">Change goal</span></button></div>';
    } else {
      h+='<button class="row" data-act="goal" style="margin:0 0 16px;justify-content:center;"><span class="lb" style="flex:0;color:'+GREEN+';font-weight:500;">Set a goal weight</span></button>';
    }

    // chart
    if(entries.length>=2){
      var w=300,ht=150, mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
      var pad=(mx-mn)*0.2||1; mn-=pad; mx+=pad;
      var pts=vals.map(function(v,i){ return [10+i*(w-20)/(vals.length-1), 10+(mx-v)/(mx-mn)*(ht-20)]; });
      var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
      var area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+ht+' L'+pts[0][0].toFixed(1)+' '+ht+' Z';
      h+='<div class="card" style="padding:14px 10px;margin-bottom:16px;"><svg viewBox="0 0 '+w+' '+ht+'" style="width:100%;height:auto;">'
        + '<path d="'+area+'" fill="rgba(74,222,128,0.10)"/>'
        + '<path d="'+line+'" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
        + '<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="4" fill="#4ade80"/></svg></div>';
    }

    h+='<div class="sect">Log</div>';
    for(var i=entries.length-1;i>=0;i--){
      var k=entries[i][0], v=entries[i][1];
      var prev = i>0 ? entries[i-1][1] : null;
      var chg = prev!=null ? v-prev : null;
      var d=new Date(k+'T00:00:00');
      h+='<div class="logrow"><span class="d">'+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</span>'
        + '<span class="w">'+v.toFixed(1)+' kg</span>'
        + '<span class="ch" style="color:'+(chg==null?MUTED:chg<=0?GREEN:RED)+'">'+(chg==null?'—':(chg<=0?'':'+')+chg.toFixed(1)+' kg')+'</span></div>';
    }
    screen.innerHTML=h;
  }

  // ---------- PROGRESS ----------
  var progWindow=7; // 7, 30, or 0 = all-time
  function renderProgress(){
    var keys=Object.keys(db.days).sort().filter(function(k){ return !isEmpty(db.days[k]); });
    var h='<div class="phead"><div><div class="t">Progress</div><div class="s">Consistency</div></div></div>';
    if(keys.length===0){
      h+='<div class="empty">Start ticking things off on the Today tab.<br>Your daily completion will build up here.</div>';
      screen.innerHTML=h; return;
    }

    // window toggle
    h+='<div class="seg">'
      + '<button class="segbtn'+(progWindow===7?' on':'')+'" data-act="win" data-w="7">7 days</button>'
      + '<button class="segbtn'+(progWindow===30?' on':'')+'" data-act="win" data-w="30">30 days</button>'
      + '<button class="segbtn'+(progWindow===0?' on':'')+'" data-act="win" data-w="0">All time</button></div>';

    var windowKeys = progWindow===0 ? keys : keys.slice(-progWindow);
    var comps=windowKeys.map(function(k){ return completion(db.days[k]); });
    var perfect=comps.filter(function(c){return c===100;}).length;
    var failed=windowKeys.filter(function(k){ return isFailure(db.days[k]); }).length;
    var avg=comps.length?Math.round(comps.reduce(function(a,b){return a+b;},0)/comps.length):0;
    var streak=0; for(var i=keys.length-1;i>=0;i--){ if(completion(db.days[keys[i]])===100) streak++; else break; }

    // weight change across window
    var wEntries=windowKeys.map(function(k){return db.days[k].weight;}).filter(function(v){return v!=null;});
    var wChange = wEntries.length>=2 ? (wEntries[wEntries.length-1]-wEntries[0]) : null;

    var lbl = progWindow===0?'all time':'last '+progWindow+' days';
    h+='<div class="stats"><div class="stat"><div class="k">Avg completion</div><div class="v">'+avg+'<small>%</small></div></div>'
      + '<div class="stat"><div class="k">Perfect days</div><div class="v" style="color:'+GREEN+'">'+perfect+'</div></div></div>';
    h+='<div class="stats" style="margin-top:0;"><div class="stat"><div class="k">Failed days</div><div class="v" style="color:'+(failed?RED:'#fff')+'">'+failed+'</div></div>'
      + '<div class="stat"><div class="k">Weight change</div><div class="v" style="color:'+(wChange==null?MUTED:wChange<=0?GREEN:RED)+'">'+(wChange==null?'—':(wChange<=0?'':'+')+wChange.toFixed(1))+(wChange==null?'':'<small> kg</small>')+'</div></div></div>';
    h+='<div style="font-size:12px;color:'+MUTED+';margin:2px 2px 0;">Summary for '+lbl+' · current streak '+streak+' day'+(streak===1?'':'s')+'</div>';

    // bar chart — cap displayed bars at 30 for readability
    var chartKeys = windowKeys.slice(-30);
    var chartComps = chartKeys.map(function(k){ return completion(db.days[k]); });
    var bars=chartKeys.map(function(k){
      var c=completion(db.days[k]);
      var col = isFailure(db.days[k]) ? '#f87171' : '#4ade80';
      return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;"><div style="width:100%;max-width:16px;height:'+(Math.max(c,4)*0.9+8)+'px;background:'+col+';border-radius:4px;"></div></div>';
    }).join('');
    h+='<div class="card" style="padding:16px 14px;margin:14px 0;">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:12px;"><span style="font-size:13px;color:#ededf0;">Daily completion</span><span style="font-size:13px;color:'+MUTED+';">avg '+avg+'%</span></div>'
      + '<div style="display:flex;align-items:flex-end;gap:'+(chartKeys.length>16?'2px':'4px')+';height:110px;">'+bars+'</div>'
      + '<div style="display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:'+MUTED+';"><span>'+chartKeys.length+'d ago</span><span>Today</span></div></div>';

    h+='<div class="sect">What the colours mean</div><div class="card" style="padding:2px 16px;">';
    [['#4ade80','Passed — 70% or more'],['#f87171','Failed — under 70%, or over '+CAL_LIMIT+' kcal']].forEach(function(l,idx){
      h+='<div style="display:flex;align-items:center;gap:10px;padding:12px 0;'+(idx<1?'border-bottom:0.5px solid '+LINE+';':'')+'"><span style="width:12px;height:12px;border-radius:3px;background:'+l[0]+';"></span><span style="font-size:13px;color:'+MUTED+';">'+l[1]+'</span></div>';
    });
    h+='</div>';

    // reset data
    h+='<div class="sect">Data</div>';
    h+='<button class="row" data-act="reset" style="justify-content:center;padding:13px;"><span class="lb" style="flex:0;color:'+RED+';font-size:14px;">Reset all data — start fresh</span></button>';
    h+='<div style="font-size:12px;color:'+MUTED+';margin-top:8px;line-height:1.5;">Wipes every logged day, weigh-in and note. Your goal weight stays. Can\'t be undone.</div>';

    screen.innerHTML=h;
  }

  // ---------- events ----------
  function render(){
    if(currentTab==='today') renderToday();
    else if(currentTab==='weight') renderWeight();
    else renderProgress();
    document.querySelectorAll('.navbtn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===currentTab); });
  }

  function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||10); }catch(e){} }

  screen.addEventListener('click', function(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var act=el.dataset.act;
    if(act==='note') return; // handled by input
    if(act==='win'){ progWindow=parseInt(el.dataset.w); renderProgress(); return; }
    if(act==='reset'){
      if(window.confirm('Reset all data? This wipes every logged day, weigh-in and note. Your goal weight stays. This cannot be undone.')){
        haptic(20); db.days={}; save(db); viewKey=todayKey(); currentTab='today'; render();
      }
      return;
    }
    var day=getDay();
    if(act==='tick'){ haptic(10); var id=el.dataset.id; day[id] = day[id]===true ? false : day[id]===false ? null : true; save(db); justChanged=id; renderToday(); justChanged=null; }
    else if(act==='steps'){ haptic(10); day.steps = !day.steps; save(db); justChanged='steps'; renderToday(); justChanged=null; }
    else if(act==='water'){ haptic(10); var i=parseInt(el.dataset.i); day.water = (day.water===i+1)? i : i+1; save(db); renderToday(); }
    else if(act==='weigh'){ openWeigh(); }
    else if(act==='calopen'){ openCal(el.dataset.id); }
    else if(act==='goal'){ openGoal(); }
    else if(act==='prevday'){ haptic(8); shiftDay(-1); renderToday(); }
    else if(act==='nextday'){ haptic(8); shiftDay(1); renderToday(); }
    else if(act==='backtoday'){ viewKey=todayKey(); renderToday(); }
    else if(act==='dismiss-install'){ db.installDismissed=true; save(db); renderToday(); }
  });

  document.getElementById('nav').addEventListener('click', function(e){
    var b=e.target.closest('.navbtn'); if(!b) return; currentTab=b.dataset.tab; render();
  });

  // weigh-in modal
  var modalbg=document.getElementById('modalbg'), winput=document.getElementById('winput');
  function openWeigh(){ var day=getDay(); winput.value = day.weight!=null ? day.weight : ''; modalbg.classList.add('show'); setTimeout(function(){ winput.focus(); },100); }
  function closeWeigh(){ modalbg.classList.remove('show'); winput.blur(); }
  document.getElementById('mcancel').addEventListener('click', closeWeigh);
  modalbg.addEventListener('click', function(e){ if(e.target===modalbg) closeWeigh(); });
  document.getElementById('msave').addEventListener('click', function(){
    var v=parseFloat(winput.value);
    if(!isNaN(v) && v>0){ getDay().weight = Math.round(v*10)/10; save(db); }
    closeWeigh(); render();
  });
  winput.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('msave').click(); });

  // goal modal
  var goalbg=document.getElementById('goalbg'), ginput=document.getElementById('ginput');
  function openGoal(){ ginput.value = db.goal!=null ? db.goal : ''; goalbg.classList.add('show'); setTimeout(function(){ ginput.focus(); },100); }
  function closeGoal(){ goalbg.classList.remove('show'); ginput.blur(); }
  document.getElementById('gcancel').addEventListener('click', closeGoal);
  goalbg.addEventListener('click', function(e){ if(e.target===goalbg) closeGoal(); });
  document.getElementById('gsave').addEventListener('click', function(){
    var v=parseFloat(ginput.value);
    if(!isNaN(v) && v>0){ db.goal = Math.round(v*10)/10; save(db); }
    closeGoal(); render();
  });
  ginput.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('gsave').click(); });

  // calorie modal
  var calbg=document.getElementById('calbg'), calinput=document.getElementById('calinput'), calCurrentId=null;
  var MEAL_LABELS={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',snacks:'Snacks'};
  function openCal(id){
    calCurrentId=id;
    document.getElementById('caltitle').textContent=MEAL_LABELS[id]+' calories';
    var day=getDay(); var c=day.cals&&day.cals[id];
    calinput.value = c!=null ? c : '';
    calbg.classList.add('show'); setTimeout(function(){ calinput.focus(); },100);
  }
  function closeCal(){ calbg.classList.remove('show'); calinput.blur(); calCurrentId=null; }
  document.getElementById('calclear').addEventListener('click', function(){
    if(calCurrentId){ getDay().cals[calCurrentId]=null; save(db); }
    closeCal(); renderToday();
  });
  calbg.addEventListener('click', function(e){ if(e.target===calbg) closeCal(); });
  document.getElementById('calsave').addEventListener('click', function(){
    if(calCurrentId){
      var v=calinput.value===''?null:Math.max(0,parseInt(calinput.value)||0);
      getDay().cals[calCurrentId]=v; save(db);
    }
    closeCal(); renderToday();
  });
  calinput.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('calsave').click(); });

  render();
})();
</script>
</body>
</html>
